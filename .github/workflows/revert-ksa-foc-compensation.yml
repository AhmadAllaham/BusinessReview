name: Revert KSA FOC compensation

on:
  push:
    paths:
      - '.github/workflows/revert-ksa-foc-compensation.yml'

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python revert_ksa_foc_compensation.py
      - run: |
          git config user.name "BusinessReview Bot"
          git config user.email "actions@users.noreply.github.com"
          git add script.js index.html
          git commit -m "Remove KSA FOC compensation note from P&L"
          git push origin HEAD:main
