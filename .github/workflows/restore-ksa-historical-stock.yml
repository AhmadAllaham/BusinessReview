name: Restore KSA historical stock

on:
  push:
    paths:
      - '.github/workflows/restore-ksa-historical-stock.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add KSA Historical Sales runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          text = re.sub(
              r'firebase-client\.js(?:\?v=[^"\']+)?',
              'firebase-client.js?v=20260806-14',
              text,
              count=1
          )

          script_tag = '  <script src="ksa-historical-stock-restore.js?v=20260806-1"></script>\n'
          if 'ksa-historical-stock-restore.js' not in text:
              marker = '  <script src="dashboard-firebase.js?v=20260802-4"></script>\n'
              if marker not in text:
                  raise SystemExit('dashboard-firebase script tag not found')
              text = text.replace(marker, script_tag + marker, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit restored calculation
        shell: bash
        run: |
          git config user.name "BusinessReview Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index update needed"
            exit 0
          fi
          git commit -m "Load restored KSA Historical Sales calculation"
          git push origin HEAD:main
