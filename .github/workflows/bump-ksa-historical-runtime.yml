name: Bump KSA historical runtime

on:
  push:
    paths:
      - '.github/workflows/bump-ksa-historical-runtime.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump runtime versions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          text = re.sub(
              r'firebase-client\.js(?:\?v=[^"\']+)?',
              'firebase-client.js?v=20260806-15',
              text,
              count=1
          )
          text = re.sub(
              r'ksa-historical-stock-restore\.js(?:\?v=[^"\']+)?',
              'ksa-historical-stock-restore.js?v=20260806-2',
              text,
              count=1
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit cache versions
        shell: bash
        run: |
          git config user.name "BusinessReview Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index update needed"
            exit 0
          fi
          git commit -m "Refresh KSA Historical Sales runtime"
          git push origin HEAD:main
