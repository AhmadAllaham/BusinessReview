name: One-time index cache bust

on:
  push:
    paths:
      - '.github/workflows/cache-bust-index.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Version dashboard bootstrap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<script src="firebase-client.js"></script>'
          new = '<script src="firebase-client.js?v=20260806-12"></script>'
          if old in text:
              text = text.replace(old, new, 1)
          elif 'firebase-client.js?v=' in text:
              import re
              text = re.sub(r'firebase-client\.js\?v=[^"\']+', 'firebase-client.js?v=20260806-12', text, count=1)
          else:
              raise SystemExit('firebase-client script tag not found')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit cache-busting update
        shell: bash
        run: |
          git config user.name "BusinessReview Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index update needed"
            exit 0
          fi
          git commit -m "Force latest dashboard bootstrap assets"
          git push origin HEAD:main
