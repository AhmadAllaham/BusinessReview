name: Run KSA Historical Sales patch

on:
  push:
    paths:
      - '.github/workflows/run-ksa-historical-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python patch_ksa_historical.py
      - run: |
          git config user.name "BusinessReview Bot"
          git config user.email "actions@users.noreply.github.com"
          git add script.js index.html
          git commit -m "Apply KSA Historical Sales directly in Stock Level"
          git push origin HEAD:main
